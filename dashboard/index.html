<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="OURANOS mission-computer health review dashboard. Runs offline." />
    <link rel="icon" href="/favicon.svg?v=star" type="image/svg+xml" />
    <title>OURANOS · Mission Health</title>
    <link rel="stylesheet" href="/starfield.css">
  <link rel="stylesheet" href="/mission-nav.css">
  <script type="module" src="/mission-nav.js"></script>
    <script type="module" src="/starfield.js"></script>
</head>
  <body>
  <canvas class="site-stars" aria-hidden="true"></canvas>
  <div id="mission-navigation"></div>
    <script>
      if (window.location.pathname === '/' && !window.location.hash) {
        let signedIn = false
        try {
          signedIn = !!sessionStorage.getItem('gg.watch-sign-in') ||
            (sessionStorage.getItem('gg.simulator-sign-in') === 'true' && (sessionStorage.getItem('gg.workspace') || localStorage.getItem('gg.workspace')) === 'demo')
        } catch {}
        if (signedIn) history.replaceState(history.state, '', window.location.search + '#/')
        else window.location.replace('/astronaut/' + window.location.search)
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
